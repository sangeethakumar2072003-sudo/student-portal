{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Student Registration</h2>

    <form method="POST">

        <label>Student Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

</div>

{% endblock %}
