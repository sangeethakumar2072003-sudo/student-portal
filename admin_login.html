{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>🔐 Admin Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Admin Login
        </button>

    </form>

</div>

{% endblock %}
