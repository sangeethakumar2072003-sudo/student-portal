{% extends "base.html" %}

{% block content %}

<h1>Registered Students</h1>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
    </tr>

    {% for student in students %}

    <tr>

        <td>{{ student["id"] }}</td>

        <td>{{ student["name"] }}</td>

        <td>{{ student["email"] }}</td>

    </tr>

    {% endfor %}

</table>

{% endblock %}
