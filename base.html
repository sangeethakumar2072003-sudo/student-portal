<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student E-Learning Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <div class="logo">
        🎓 E-Learning Portal
    </div>

    <div class="nav-links">

        <a href="{{ url_for('index') }}">
            Home
        </a>

        {% if session.get("student_id") %}

        <a href="{{ url_for('student_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('courses') }}">
            Courses
        </a>

        <a href="{{ url_for('my_results') }}">
            My Results
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

        {% elif session.get("admin") %}

        <a href="{{ url_for('admin_dashboard') }}">
            Admin Dashboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

        {% else %}

        <a href="{{ url_for('login') }}">
            Student Login
        </a>

        <a href="{{ url_for('register') }}">
            Register
        </a>

        <a href="{{ url_for('admin_login') }}">
            Admin
        </a>

        {% endif %}

    </div>

</nav>

<main>

    {% block content %}
    {% endblock %}

</main>

<footer>

    <p>
        © 2026 Student E-Learning Portal
    </p>

</footer>

</body>
</html>
