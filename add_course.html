{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h2>Add Course</h2>

    <form method="POST">

        <label>Course Name</label>

        <input
            type="text"
            name="title"
            required
        >

        <label>Description</label>

        <textarea
            name="description"
            required
        ></textarea>

        <label>Duration</label>

        <input
            type="text"
            name="duration"
            placeholder="Example: 8 Weeks"
            required
        >

        <button type="submit">
            Add Course
        </button>

    </form>

</div>

{% endblock %}
